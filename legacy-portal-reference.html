// ===== SECURITY & FEATURE EXTENSIONS =====
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = new TextEncoder();
const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
async function sha256(t) { return hex(await crypto.subtle.digest('SHA-256', enc.encode(t))); }
async function hashPw(pw, salt) {
    const key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
    return hex(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode(salt), iterations: 120000, hash: 'SHA-256' }, key, 256));
}
async function mkCred(pw) { const salt = hex(crypto.getRandomValues(new Uint8Array(16))); return { salt, passHash: await hashPw(pw, salt) }; }
const strongPw = p => p.length >= 8 && p.length <= 32 && /[A-Za-z]/.test(p) && /\d/.test(p);
async function migrateUsers() {
    let ch = false;
    for (const u of allUsers) if (u.password !== undefined) { Object.assign(u, await mkCred(u.password)); delete u.password; ch = true; }

// Brute-force lockout (5 failed attempts = 60s lock)
const getFails = () => { try { return JSON.parse(localStorage.getItem('geoterra_fails')) || {}; } catch (e) { return {}; } };
function recordFail(u) {
    const f = getFails(), r = f[u] || { n: 0, until: 0 };
    r.n++; if (r.n >= 5) { r.until = Date.now() + 60000; r.n = 0; }
    f[u] = r; localStorage.setItem('geoterra_fails', JSON.stringify(f));
    audit('Failed sign-in attempt', u);
}
function clearFails(u) { const f = getFails(); delete f[u]; localStorage.setItem('geoterra_fails', JSON.stringify(f)); }
function getLockRemaining(u) { const r = getFails()[u]; return r ? Math.max(0, Math.ceil((r.until - Date.now()) / 1000)) : 0; }
// Audit log
const getAudit = (u = currentUserSession && currentUserSession.username) => { try { return JSON.parse(localStorage.getItem('geoterra_audit_' + u)) || []; } catch (e) { return []; } };
function audit(action, u = currentUserSession && currentUserSession.username) {
    if (!u) return;
    const l = getAudit(u); l.unshift({ t: new Date().toISOString(), a: action });
    localStorage.setItem('geoterra_audit_' + u, JSON.stringify(l.slice(0, 100)));
}
// Auto sign-out after 10 minutes idle
let lastActive = Date.now();
window.touchActivity = () => { lastActive = Date.now(); };
['click', 'keydown', 'touchstart', 'mousemove'].forEach(e => document.addEventListener(e, () => { lastActive = Date.now(); }, { passive: true }));
setInterval(() => {
    if (currentUserSession && Date.now() - lastActive > 600000) {
        audit('Session expired (inactivity)'); handleLogout();
        showModalMessage('Session Expired', 'You were signed out after 10 minutes of inactivity to protect your land records.', 'info');
    }
}, 15000);
// Tamper-evident record fingerprints
async function plotFp(p) { return (await sha256(JSON.stringify([p.landNumber, p.mouza, p.area, p.coordinates, p.currentCrop, p.imageVerification, p.policeVerification, p.cropVerification, p.notes]))).slice(0, 16); }
async function storeFingerprints() { const m = {}; for (const p of userLands) m[p.id] = await plotFp(p); localStorage.setItem('geoterra_fp_' + currentUserSession.username, JSON.stringify(m)); }
async function fillFingerprints() {
    let m = {}; try { m = JSON.parse(localStorage.getItem('geoterra_fp_' + currentUserSession.username)) || {}; } catch (e) {}
    for (const p of userLands) {
        const el = document.getElementById('fp-' + p.id); if (!el) continue;
        const cur = await plotFp(p), ok = !m[p.id] || m[p.id] === cur;
        el.innerHTML = `<code class="font-mono text-[11px]">${cur}</code> <span class="px-2 py-0.5 rounded text-[10px] font-bold ${ok ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">${ok ? 'Intact' : 'Changed outside portal'}</span>`;
    }
}
// District & police data (unit names only; verify contacts on official sites)
const DISTRICTS = [
    { k: ['dhaka'], n: 'Dhaka', lat: 23.8103, lon: 90.4125, police: 'Dhaka Metropolitan Police (DMP)', type: 'Metropolitan Police' },
    { k: ['gazipur'], n: 'Gazipur', lat: 23.9999, lon: 90.4203, police: 'Gazipur Metropolitan Police (GMP)', type: 'Metropolitan Police' },
    { k: ['chittagong', 'chattogram'], n: 'Chattogram', lat: 22.3569, lon: 91.7832, police: 'Chattogram Metropolitan Police (CMP)', type: 'Metropolitan Police' },
    { k: ['sylhet'], n: 'Sylhet', lat: 24.8949, lon: 91.8687, police: 'Sylhet Metropolitan Police (SMP)', type: 'Metropolitan Police' },
    { k: ['rajshahi'], n: 'Rajshahi', lat: 24.3745, lon: 88.6042, police: 'Rajshahi Metropolitan Police (RMP)', type: 'Metropolitan Police' },
    { k: ['khulna'], n: 'Khulna', lat: 22.8456, lon: 89.5403, police: 'Khulna Metropolitan Police (KMP)', type: 'Metropolitan Police' },
    { k: ['barisal', 'barishal'], n: 'Barishal', lat: 22.7010, lon: 90.3535, police: 'Barishal Metropolitan Police (BMP)', type: 'Metropolitan Police' },
    { k: ['comilla', 'cumilla'], n: 'Cumilla', lat: 23.4607, lon: 91.1809, police: 'Cumilla District Police', type: 'District Police (SP Office)' },
    { k: ['bogra', 'bogura'], n: 'Bogura', lat: 24.8465, lon: 89.3773, police: 'Bogura District Police', type: 'District Police (SP Office)' },
    { k: ['mymensingh'], n: 'Mymensingh', lat: 24.7471, lon: 90.4203, police: 'Mymensingh District Police', type: 'District Police (SP Office)' },
    { k: ['rangpur'], n: 'Rangpur', lat: 25.7439, lon: 89.2752, police: 'Rangpur Metropolitan Police (RMP)', type: 'Metropolitan Police' }
];
function districtInfo(d) {
    const s = (d || '').toLowerCase();
    return DISTRICTS.find(x => x.k.some(k => s.includes(k))) || { n: d || 'Your district', lat: 23.685, lon: 90.356, police: (d || 'Local') + ' District Police', type: 'District Police (SP Office)' };
}
function parseCoords(s) {
    const m = String(s).match(/(-?\d+(?:\.\d+)?)\s*°?\s*([NS])?[\s,;]+(-?\d+(?:\.\d+)?)\s*°?\s*([EW])?/i);
    if (!m) return null;
    let la = +m[1], lo = +m[3]; if (/s/i.test(m[2] || '')) la = -la; if (/w/i.test(m[4] || '')) lo = -lo;
    return Math.abs(la) <= 90 && Math.abs(lo) <= 180 ? { lat: la, lon: lo } : null;
}
// Live weather (Open-Meteo, free, no key)
const WX = {};
function wxInfo(c) {
    if (c === 0) return ['Clear sky', 'fa-sun']; if (c <= 2) return ['Partly cloudy', 'fa-cloud-sun']; if (c === 3) return ['Overcast', 'fa-cloud'];
    if (c <= 48) return ['Fog', 'fa-smog']; if (c <= 57) return ['Drizzle', 'fa-cloud-rain']; if (c <= 67) return ['Rain', 'fa-cloud-showers-heavy'];
    if (c <= 77) return ['Snow', 'fa-snowflake']; if (c <= 82) return ['Rain showers', 'fa-cloud-showers-heavy']; return ['Thunderstorm', 'fa-cloud-bolt'];
}
async function getWeather(lat, lon) {
    const k = lat.toFixed(2) + ',' + lon.toFixed(2);
    if (WX[k] && Date.now() - WX[k].t < 600000) return WX[k].d;
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max&timezone=auto&forecast_days=7`);
    if (!r.ok) throw new Error('weather'); const d = await r.json(); WX[k] = { t: Date.now(), d }; return d;
}
function advisories(d) {
    const c = d.current, dy = d.daily, a = [];
    const rain3 = dy.precipitation_sum.slice(0, 3).reduce((x, y) => x + (y || 0), 0);
    if (c.temperature_2m >= 36) a.push(['red', 'Extreme heat: irrigate early morning or evening and shade young plants.']);
    if (c.wind_speed_10m >= 40) a.push(['red', 'Strong winds: secure fences, tall crops and storage sheds.']);
    if (rain3 >= 50) a.push(['red', `Heavy rain expected (~${Math.round(rain3)} mm in 3 days): clear drainage, delay spraying, harvest ripe crop early.`]);
    else if (Math.max(...dy.precipitation_probability_max.slice(0, 3).map(x => x || 0)) >= 60) a.push(['amber', 'Rain likely within 3 days: plan sowing, spraying and harvest around it.']);
    if (!a.length) a.push(['green', 'No weather risks detected. Good conditions for field work.']);
    return a;
}
function wxHtml(d) {
    const c = d.current, [lbl, ic] = wxInfo(c.weather_code);
    const days = d.daily.time.map((t, i) => {
        const dn = new Date(t + 'T12:00').toLocaleDateString('en-GB', { weekday: 'short' });
        return `<div class="text-center bg-slate-50 border border-slate-200 rounded-xl p-2 min-w-[62px]"><div class="text-[10px] font-bold text-slate-500">${i ? dn : 'Today'}</div><i class="fa-solid ${wxInfo(d.daily.weather_code[i])[1]} text-emerald-600 my-1"></i><div class="text-xs font-bold">${Math.round(d.daily.temperature_2m_max[i])}°</div><div class="text-[10px] text-slate-400">${Math.round(d.daily.temperature_2m_min[i])}°</div><div class="text-[10px] text-blue-600"><i class="fa-solid fa-droplet"></i> ${d.daily.precipitation_probability_max[i] ?? 0}%</div></div>`;
    }).join('');
    const adv = advisories(d).map(([k, m]) => `<div class="text-xs p-2.5 rounded-lg border ${k === 'red' ? 'bg-red-50 border-red-200 text-red-700' : k === 'amber' ? 'bg-amber-50 border-amber-200 text-amber-700' : 'bg-green-50 border-green-200 text-green-700'}">${esc(m)}</div>`).join('');
    return `<div class="flex items-center gap-4"><i class="fa-solid ${ic} text-4xl text-emerald-600"></i><div><div class="text-3xl font-black text-slate-800">${Math.round(c.temperature_2m)}°C</div><div class="text-xs text-slate-500">${lbl} &bull; feels ${Math.round(c.apparent_temperature)}°C</div></div></div>
    <div class="grid grid-cols-3 gap-2 text-center text-xs my-4"><div class="bg-slate-50 rounded-lg p-2"><i class="fa-solid fa-droplet text-blue-500"></i><div class="font-bold">${c.relative_humidity_2m}%</div><div class="text-[10px] text-slate-400">Humidity</div></div><div class="bg-slate-50 rounded-lg p-2"><i class="fa-solid fa-wind text-slate-500"></i><div class="font-bold">${c.wind_speed_10m} km/h</div><div class="text-[10px] text-slate-400">Wind</div></div><div class="bg-slate-50 rounded-lg p-2"><i class="fa-solid fa-cloud-rain text-indigo-500"></i><div class="font-bold">${c.precipitation} mm</div><div class="text-[10px] text-slate-400">Rain now</div></div></div>
    <div class="space-y-2 mb-4">${adv}</div><div class="text-[10px] font-bold uppercase text-slate-400 mb-2">7-day forecast</div><div class="flex gap-2 overflow-x-auto pb-1">${days}</div>
    <p class="text-[10px] text-slate-400 mt-3">Live data: Open-Meteo. For cyclone/flood warnings follow the Bangladesh Meteorological Department (BMD).</p>`;
}

let selectedPlotId = null;
const TITLES = { dashboard: 'Land Registry Dashboard', lands: 'My Land Plots & Mapping', verifications: 'Verification & Clearance Status', intel: 'Satellite View & Live Weather', police: 'Police Info & Emergency', security: 'Security Center' };
function navExtra(m) {
    return [['intel', 'fa-satellite', 'Satellite & Weather'], ['police', 'fa-building-shield', 'Police & Emergency'], ['security', 'fa-user-shield', 'Security Center']].map(([t, i, l]) => m

        : `<button type="button" onclick="switchTab('${t}')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition ${activeTab === t ? 'bg-emerald-600 text-white shadow-lg' : 'hover:bg-slate-800 text-slate-400 hover:text-white'}"><i class="fa-solid ${i} w-5"></i> ${l}</button>`).join('');
}
function renderTab(a, b) {
    return activeTab === 'dashboard' ? renderDashboardTab(a, b) : activeTab === 'lands' ? renderLandsTab() : activeTab === 'intel' ? renderIntelTab()
        : activeTab === 'police' ? renderPoliceTab() : activeTab === 'security' ? renderSecurityTab() : renderVerificationsTab();
}
function afterRender() {
    if (!currentUserSession) return;
    if (activeTab === 'intel') initIntel(); else if (activeTab === 'dashboard') initDashWx(); else if (activeTab === 'security') fillFingerprints();
}
const curPlot = () => userLands.find(p => p.id === selectedPlotId) || userLands[0];
window.selectPlot = id => { selectedPlotId = id; renderApp(); };
window.viewPlotIntel = id => { selectedPlotId = id; switchTab('intel'); };
window.refreshWx = () => { Object.keys(WX).forEach(k => delete WX[k]); renderApp(); };
const card = 'bg-white rounded-2xl border border-slate-200 shadow-xs';
function renderIntelTab() {
    if (!userLands.length) return `<div class="${card} p-12 text-center text-sm text-slate-500">Register a land plot first to see its satellite view and weather.</div>`;
    const p = curPlot();
    return `<div class="space-y-6"><div class="flex flex-wrap justify-between items-center gap-3"><div><h3 class="text-base font-bold text-slate-800">Satellite View & Live Weather</h3><p class="text-xs text-slate-500">Pick a plot to see its location from space and the weather over it.</p></div>
    <div class="flex gap-2"><select onchange="selectPlot(this.value)" class="px-3 py-2 border border-slate-300 rounded-lg text-xs font-semibold bg-white">${userLands.map(x => `<option value="${esc(x.id)}" ${x.id === p.id ? 'selected' : ''}>${esc(x.landNumber)} - ${esc(x.mouza)}</option>`).join('')}</select>
    <button type="button" onclick="refreshWx()" class="px-3 py-2 bg-emerald-600 text-white rounded-lg text-xs font-bold"><i class="fa-solid fa-rotate"></i> Refresh</button></div></div>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6"><div class="lg:col-span-2 ${card} overflow-hidden"><div id="sat-map" style="height:460px" class="bg-slate-200 z-0"></div>
    <div class="px-4 py-2 text-[11px] text-slate-500 border-t border-slate-200"><i class="fa-solid fa-circle-info"></i> Green circle = approximate extent from the recorded area (${esc(p.area)}). It is <b>not</b> a legal survey boundary. GPS: ${esc(p.coordinates)}</div></div>
    <div class="${card} p-5"><h4 class="font-bold text-slate-800 text-sm mb-3"><i class="fa-solid fa-cloud-sun text-emerald-600"></i> Weather at ${esc(p.landNumber)}</h4><div id="wx-box" class="text-xs text-slate-400"><i class="fa-solid fa-spinner fa-spin"></i> Loading live forecast...</div></div></div></div>`;
}
async function initIntel() {
    const p = curPlot(); if (!p) return;
    const c = parseCoords(p.coordinates) || districtInfo(currentUserSession.district);
    const mapEl = document.getElementById('sat-map');
    if (window.L && mapEl) {
        const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics' });
        const lab = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 });
        const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' });
        const map = L.map(mapEl, { layers: [sat, lab] }).setView([c.lat, c.lon], 18);
        L.control.layers({ 'Satellite': sat, 'Street map': osm }, { 'Place labels': lab }).addTo(map);
        L.circle([c.lat, c.lon], { radius: Math.sqrt((parseFloat(p.area) || 10) * 40.47 / Math.PI), color: '#16a34a', weight: 2, fillOpacity: 0.15 }).addTo(map);
        L.marker([c.lat, c.lon]).addTo(map).bindPopup(`<b>${esc(p.landNumber)}</b><br>${esc(p.mouza)}`).openPopup();
    } else if (mapEl) mapEl.innerHTML = '<div class="p-8 text-xs text-slate-500">Map could not load. Check your internet connection.</div>';
    try { const d = await getWeather(c.lat, c.lon); const b = document.getElementById('wx-box'); if (b) b.innerHTML = wxHtml(d); }
    catch (e) { const b = document.getElementById('wx-box'); if (b) b.innerHTML = '<span class="text-red-600">Weather unavailable. Check your connection and press Refresh.</span>'; }
}
async function initDashWx() {
    const p = userLands[0], c = (p && parseCoords(p.coordinates)) || districtInfo(currentUserSession.district);
    try {

// LOGIN WITH ANIMATED DELAY
window.handleLogin = async function(event) {
    event.preventDefault();
    const form = event.target;
    const usernameInput = form.username.value.trim().toLowerCase();
    const passwordInput = form.password.value.trim();
    
    // Enable loading spinner state
    isSubmitting = true;
    renderApp();
    
    // Artificial delay for smooth animation experience (1.2 seconds)
    await new Promise(resolve => setTimeout(resolve, 1200));
    
    let matchedUser = null;
    if (getLockRemaining(usernameInput) > 0) {
        isSubmitting = false;
        showModalMessage('Account Temporarily Locked', `Too many failed attempts. Try again in ${getLockRemaining(usernameInput)} seconds.`, 'error');
        return;
    }
    const cand = allUsers.find(u => u.username === usernameInput);
    if (cand && cand.passHash && await hashPw(passwordInput, cand.salt) === cand.passHash) matchedUser = cand;
    isSubmitting = false;
    
    if (matchedUser) {
        currentUserSession = matchedUser; clearFails(usernameInput); audit('Signed in'); touchActivity();
        localStorage.setItem('geoterra_current_user', JSON.stringify({ username: matchedUser.username }));
        await loadUserLands();
        showModalMessage('Login Successful', `Welcome back, ${matchedUser.fullName}! Portal loaded successfully.`, 'success');
    } else {
        recordFail(usernameInput);
        showModalMessage('Authentication Failed', 'Invalid username or password. Please check your credentials or register a new account.', 'error');
    }
};

// REGISTER WITH ANIMATED DELAY
window.handleRegister = async function(event) {
    event.preventDefault();
    const form = event.target;
    const username = form.username.value.trim().toLowerCase();
    const password = form.password.value.trim();
    const fullName = form.fullName.value.trim();
    const role = form.role.value.trim();
    const district = form.district.value.trim();
    const phone = form.phone.value.trim();
    
    if (password.length > 32) {
        showModalMessage('Registration Error', 'Password cannot exceed 32 digits/characters.', 'error');
        return;
    }
    
    if (!strongPw(password)) {
        showModalMessage('Weak Password', 'Use 8-32 characters with at least one letter and one number.', 'error');
        return;
    }
    
    const existingUser = allUsers.find(u => u.username === username);
    if (existingUser) {
        showModalMessage('Username Taken', 'This username is already registered. Please choose a different username.', 'error');
        return;
    }

window.handleImageUpload = function(input) {
    const file = input.files[0];
    if (!file) return;
    const validTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/webp'];
    if (!validTypes.includes(file.type)) {
        showModalMessage('Invalid File', 'Please upload a valid image file (JPG, PNG, or WEBP).', 'error');
        return;
    }
    if (file.size > 5 * 1024 * 1024) {
        showModalMessage('File Too Large', 'Please upload an image smaller than 5MB.', 'error');
        return;
    }
    const reader = new FileReader();
    reader.onload = function(e) {
        const base64Data = e.target.result;
        const imageUrlInput = document.querySelector('input[name="landImage"]');
        if (imageUrlInput) imageUrlInput.value = base64Data;
        const previewImg = document.getElementById('image-preview');
        if (previewImg) {
            previewImg.src = base64Data;
            previewImg.style.display = 'block';
        }
        showModalMessage('Image Uploaded', 'Image successfully uploaded and ready for submission.', 'success');
    };
    reader.readAsDataURL(file);
};

window.saveLandPlot = async function(event) {
    event.preventDefault();
    const form = event.target;
    
    // Show spinner/loading state on save button inside the modal
    const saveBtn = document.getElementById('modal-save-btn');
    const originalBtnText = saveBtn ? saveBtn.innerHTML : '';
    if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Saving Record...`;
    }
    
    // Artificial delay for smooth save animation (1.0 second)
    await new Promise(resolve => setTimeout(resolve, 1000));
    
    const landData = {
        id: editingLandId || 'plot-' + Date.now(),
        landNumber: form.landNumber.value,
        mouza: form.mouza.value,
        area: form.area.value,
        coordinates: form.coordinates.value,
        currentCrop: form.currentCrop.value,
        pastHistory: form.pastHistory.value,
        imageVerification: form.imageVerification.value,
        policeVerification: form.policeVerification.value,

        notes: form.notes.value
    };
    
    if (editingLandId) {
        const index = userLands.findIndex(p => p.id === editingLandId);
        if (index !== -1) userLands[index] = landData;
    } else {
        userLands.push(landData);

    closeLandFormModal();
    audit((editingLandId ? 'Updated' : 'Registered') + ' land plot ' + landData.landNumber);

function renderApp() {
    const appEl = document.getElementById('app');
    if (!currentUserSession) {
        appEl.innerHTML = renderAuthView();
    } else {
        appEl.innerHTML = renderPortalLayout();
    }
    
    afterRender();
    const existingMsg = document.getElementById('message-modal');
    if (existingMsg) existingMsg.remove();
    
    if (messageBoxConfig.show) {
        const modalDiv = document.createElement('div');
        modalDiv.id = 'message-modal';
        modalDiv.className = 'fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in fade-in duration-200';
        modalDiv.innerHTML = `
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 border border-slate-100 text-center transform transition-all">
        <div class="w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-4 ${messageBoxConfig.type === 'error' ? 'bg-red-100 text-red-600' : 'bg-emerald-100 text-emerald-600'}">
        <i class="fa-solid ${messageBoxConfig.type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-check'} text-xl"></i>
        </div>
        <h3 class="text-lg font-bold text-slate-800 mb-2">${esc(messageBoxConfig.title)}</h3>
        <p class="text-sm text-slate-600 mb-6">${esc(messageBoxConfig.message)}</p>
        <button type="button" onclick="closeModalMessage()" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-medium rounded-xl text-sm transition shadow-lg">Continue</button>

        `;
        document.body.appendChild(modalDiv);
    }
}

// Initialize on window load
window.onload = async function() {
    await initFirebase();
    const savedUser = localStorage.getItem('geoterra_current_user');
    if (savedUser) {
        try {
            const su = JSON.parse(savedUser); currentUserSession = allUsers.find(u => u.username === su.username) || null; touchActivity();
            await loadUserLands();
        } catch(e) {
            currentUserSession = null;
        }
    }
    renderApp();
};

</script>
